<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini App</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <header>
        <h1 class="title">Muzo</h1>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Трек, альбом, исполнитель">
        </div>
    </header>

    <main class="app">
        <div class="song">
            <img src="assets/covers/preview.jpg" class="" alt="Preview">
            <div class="song-info">
                <h3 class="song-title">dope n love</h3>
                <p class="author">Yazi, qweblessed</p>
            </div>
        </div>
        <div class="song">
            <img src="assets/covers/preview.jpg" class="" alt="Preview">
            <div class="song-info">
                <h3 class="song-title">dope n love</h3>
                <p class="author">Yazi, qweblessed</p>
            </div>
        </div>
    </main>

    <footer class="categories">
        <section class="category">
            <h3>Плейлисты</h3>
        </section>

        <section class="category selected">
            <h3>Поиск</h3>
        </section>

        <section class="category">
            <h3>Настройки</h3>
        </section>
    </footer>

    <script src="./app.js"></script>

</body>
</html>
